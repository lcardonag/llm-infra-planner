apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: llm-hardware-calculator
  labels:
    app.kubernetes.io/name: llm-hardware-calculator
spec:
  runPolicy: Serial
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.openshift
  output:
    to:
      kind: ImageStreamTag
      name: llm-hardware-calculator:latest
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
